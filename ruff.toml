line-length = 88
target-version = "py314"

[lint]
select = [
    "E4", # Ошибки импорта и синтаксиса
    "E7", # Ошибки конструкций
    "E9", # Ошибки выполнения
    "F",  # Pyflakes: ошибки и подозрительный код
    "I",  # Сортировка импортов
    "B",  # Возможные баги
    "UP", # Современные возможности Python
]

[format]
quote-style = "double"
indent-style = "space"
